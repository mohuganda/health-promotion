services:
  postgres:
    image: postgres:16-alpine
    container_name: promotions_postgres
    environment:
      POSTGRES_DB: promotions_db
      POSTGRES_USER: postsuser
      POSTGRES_PASSWORD: postspassword
    ports:
      - "5478:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: promotions_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postsuser
      DB_PASSWORD: postspassword
      DB_NAME: promotions_db
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      JWT_SECRET: -secret
      PORT: 8080
    ports:
      - "8421:8080"
    volumes:
      - ./backend:/app
      - /app/tmp
      - ./backend/uploads:/app/uploads
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: promotions_frontend
    ports:
      - "3218:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: